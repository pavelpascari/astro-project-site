# Reusable workflow: checks, builds and deploys an astro-project-site site to Cloudflare Workers.
#
# A project calls it from its own workflow (this is the whole file the starter ships):
#
#   on: [pull_request, push, workflow_dispatch]
#   jobs: { site: { uses: pavelpascari/astro-project-site/.github/workflows/deploy.yml@v0.1.0-beta.5,
#                   permissions: { contents: read, pull-requests: write },
#                   secrets: { CLOUDFLARE_API_TOKEN: ..., CLOUDFLARE_ACCOUNT_ID: ... } } }
#   permissions: {}
#
# Pin it to a release tag (or, stricter, a full commit SHA), and pass only the secrets below, never `inherit`.
# Every tool that runs with the Cloudflare secrets (wrangler, project-site) is the lockfile-pinned copy from the
# project's node_modules; nothing is fetched from the registry at deploy time.
#
#   pull request   → preview at https://pr-<number>-<worker>.<subdomain>.workers.dev (sticky PR comment)
#   push to main   → preview at https://next-<worker>.<subdomain>.workers.dev
#   tag v*         → production (wrangler deploy)
#   manual run     → production if `production` is true, otherwise a preview aliased to the branch name
#   other pushes   → checks and build only
# Deploys are skipped (not failed) for fork PRs and when CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set.
#
# Security model:
#   - build runs the project's code (npm ci, astro) with a read-only token and no secrets.
#   - deploy holds the Cloudflare secrets; it never runs for fork PRs, and the secrets are only in the
#     environment of the steps that talk to Cloudflare (not of `npm ci`). Its npm install uses no cache.
#   - pull_request_target and workflow_run callers are refused: they would run with secrets on untrusted input.
#   - inputs are validated before use: folders must stay inside the repository, the worker name is a slug,
#     source-repo is owner/name.
name: Site

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding the site's package.json, astro.config.mjs and wrangler.jsonc, relative to the repo root
        type: string
        default: .
      install-directory:
        description: Folder to run `npm ci` in (the one with package-lock.json). Defaults to working-directory; set it to '.' for a workspace member
        type: string
        default: ''
      worker-name:
        description: Cloudflare Worker name; overrides `name` in wrangler.jsonc
        type: string
        default: ''
      source-repo:
        description: A second repository the mirrors or externalDocs read from (owner/name), checked out next to this one under its own name
        type: string
        default: ''
      source-ref:
        description: Branch, tag or SHA of source-repo
        type: string
        default: main
      node-version:
        type: string
        default: '22'
      production:
        description: Deploy to production (manual runs)
        type: boolean
        default: false
      deploy:
        description: Set to false to only check and build
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      SOURCE_REPO_TOKEN:
        description: Read-only token for a private source-repo, also given to the build as GITHUB_TOKEN for private externalDocs git sources
        required: false
    outputs:
      url:
        description: The preview or production URL, when deployed
        value: ${{ jobs.deploy.outputs.url }}

permissions: {}

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build # = the job id, so check names stay "build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    outputs:
      target: ${{ steps.target.outputs.target }}
      alias: ${{ steps.target.outputs.alias }}
    defaults:
      run:
        # The repository is checked out into a folder named after it, so source-repo can sit beside it.
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
    steps:
      # Before anything reads an input: every later step (and the deploy job) relies on these checks.
      - name: Validate the trigger and inputs
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REPO_NAME: ${{ github.event.repository.name }}
          WORKING_DIR: ${{ inputs.working-directory }}
          INSTALL_DIR: ${{ inputs.install-directory }}
          WORKER_NAME: ${{ inputs.worker-name }}
          SOURCE_REPO: ${{ inputs.source-repo }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          fail() { echo "::error title=Invalid input::$1"; exit 1; }
          case "$EVENT" in
            pull_request_target|workflow_run)
              fail "this workflow does not run on $EVENT: it would build untrusted code with secrets. Call it from pull_request." ;;
          esac
          # A folder relative to the repository root that stays inside it.
          inside_repo() {
            case "$2" in /*|\~*) fail "$1 must be relative to the repository root, got '$2'" ;; esac
            [[ "$2" =~ ^[A-Za-z0-9._/@+-]*$ ]] || fail "$1 may only contain letters, digits and . _ / @ + -, got '$2'"
            local resolved
            resolved=$(realpath -m --relative-to="$PWD/repo" "$PWD/repo/$2")
            case "$resolved" in ..|../*) fail "$1 must stay inside the repository, got '$2'" ;; esac
          }
          inside_repo working-directory "$WORKING_DIR"
          inside_repo install-directory "$INSTALL_DIR"
          if [ -n "$WORKER_NAME" ] && ! [[ "$WORKER_NAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            fail "worker-name must be lowercase letters, digits and dashes (max 63, no leading or trailing dash), got '$WORKER_NAME'"
          fi
          if [ -n "$SOURCE_REPO" ]; then
            [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || fail "source-repo must be owner/name, got '$SOURCE_REPO'"
            name=${SOURCE_REPO#*/}
            case "$name" in .|..) fail "source-repo has an invalid name: '$SOURCE_REPO'" ;; esac
            [ "$name" != "$REPO_NAME" ] || fail "source-repo '$SOURCE_REPO' has the same name as this repository; both are checked out by name side by side"
            [[ "$SOURCE_REF" =~ ^[A-Za-z0-9._/@+-]+$ && "$SOURCE_REF" != -* ]] || fail "source-ref is not a valid branch, tag or SHA: '$SOURCE_REF'"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false

      - name: Locate ${{ inputs.source-repo }}
        id: source
        if: inputs.source-repo != ''
        working-directory: .
        env:
          SOURCE_REPO: ${{ inputs.source-repo }}
        run: echo "path=${SOURCE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Check out ${{ inputs.source-repo }}
        if: inputs.source-repo != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source-repo }}
          ref: ${{ inputs.source-ref }}
          path: ${{ steps.source.outputs.path }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          persist-credentials: false

      # actions/setup-node rejects paths containing '.' or '..' segments, so normalise them first.
      - name: Resolve paths
        id: paths
        working-directory: .
        env:
          REPO_DIR: ${{ github.event.repository.name }}
          INSTALL_DIR: ${{ inputs.install-directory || inputs.working-directory }}
        run: echo "install=$(realpath -m --relative-to=. "$REPO_DIR/$INSTALL_DIR")" >> "$GITHUB_OUTPUT"

      # The npm cache is fine here: this job holds no secrets and deploys nothing, and npm ci checks every package
      # against package-lock.json's integrity hashes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ steps.paths.outputs.install }}/package-lock.json

      - name: Install
        working-directory: ${{ steps.paths.outputs.install }}
        run: npm ci

      # Both steps load the config, which downloads externalDocs `git` sources; the token is only needed for
      # private ones on github.com (empty otherwise).
      - name: Type-check
        env:
          GITHUB_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: npx --no-install astro check

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: npx --no-install astro build

      - name: Check generated docs
        run: |
          if [ -f docs-gen.config.mjs ]; then npx --no-install project-site docs:check; else echo "No docs-gen.config.mjs; skipping."; fi

      - name: Decide the target
        id: target
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          PRODUCTION: ${{ inputs.production }}
        run: |
          if [[ "$REF" == refs/tags/v* ]] || [[ "$EVENT" == workflow_dispatch && "$PRODUCTION" == true ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == pull_request ]]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"; echo "alias=pr-$PR" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/heads/main ]]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"; echo "alias=next" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"; echo "alias=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "target=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ github.event.repository.name }}/${{ inputs.working-directory }}/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy # = the job id, so check names stay "deploy"
    needs: build
    # Fork PRs get no secrets; don't even try.
    if: >-
      inputs.deploy && needs.build.outputs.target != 'none' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One upload per alias at a time; a newer push to the same PR replaces a queued one. Production never cancels.
    concurrency:
      group: deploy-${{ github.repository }}-${{ needs.build.outputs.target == 'production' && 'production' || needs.build.outputs.alias }}
      cancel-in-progress: ${{ needs.build.outputs.target != 'production' }}
    # `production` or `preview`: add protection rules (required reviewers, deployment tags v*) and environment
    # secrets in the repository's Settings → Environments.
    environment:
      name: ${{ needs.build.outputs.target }}
      url: ${{ steps.preview.outputs.url || steps.production.outputs.url }}
    permissions:
      contents: read       # check out the repository
      pull-requests: write # the sticky preview comment
    outputs:
      url: ${{ steps.preview.outputs.url || steps.production.outputs.url }}
    defaults:
      run:
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
    steps:
      - name: Check credentials
        id: creds
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not available to this run (fork PR, Dependabot, or not configured yet)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ok
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false

      - name: Resolve paths
        id: paths
        if: steps.creds.outputs.ok
        working-directory: .
        env:
          REPO_DIR: ${{ github.event.repository.name }}
          INSTALL_DIR: ${{ inputs.install-directory || inputs.working-directory }}
        run: echo "install=$(realpath -m --relative-to=. "$REPO_DIR/$INSTALL_DIR")" >> "$GITHUB_OUTPUT"

      # No dependency cache in the job that holds the deploy secrets.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.creds.outputs.ok
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      # For wrangler and the project-site CLI, at the versions package-lock.json pins. The Cloudflare secrets are not
      # in this step's environment.
      - name: Install
        if: steps.creds.outputs.ok
        working-directory: ${{ steps.paths.outputs.install }}
        run: npm ci

      - name: Check that wrangler is installed
        if: steps.creds.outputs.ok
        run: |
          if ! npx --no-install wrangler --version > /dev/null 2>&1; then
            echo "::error title=wrangler missing::wrangler is not in this project's dependencies. Add it as a devDependency (npm i -D wrangler) so deploys use the version package-lock.json pins."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.creds.outputs.ok
        with:
          name: dist
          path: ${{ github.event.repository.name }}/${{ inputs.working-directory }}/dist

      # worker-name was checked to be a slug in the build job, so it is safe inside the sed expression.
      - name: Worker name
        if: steps.creds.outputs.ok && inputs.worker-name != ''
        env:
          NAME: ${{ inputs.worker-name }}
        run: |
          sed -i -E "0,/\"name\"[[:space:]]*:[[:space:]]*\"[^\"]*\"/s//\"name\": \"$NAME\"/" wrangler.jsonc

      - name: Upload preview version
        id: preview
        if: steps.creds.outputs.ok && needs.build.outputs.target == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: ${{ needs.build.outputs.alias }}
          MESSAGE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} @ ${{ github.sha }}"
        run: npx --no-install project-site deploy:preview --alias "$ALIAS" --message "$MESSAGE"

      - name: Deploy to production
        id: production
        if: steps.creds.outputs.ok && needs.build.outputs.target == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          npx --no-install wrangler deploy --message "${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
          # First route wrangler reports (workers.dev or custom domain), for the environment link.
          # shellcheck disable=SC2016 # the single-quoted program is JavaScript, its ${...} are template literals
          url=$(node -e '
            const lines = require("fs").readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").split("\n").filter(Boolean);
            const target = lines.map(JSON.parse).findLast((e) => e.type === "deploy")?.targets?.[0] ?? "";
            const host = target.split(" ")[0];
            console.log(host && !host.includes("://") ? `https://${host}` : host);
          ' || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production: ${url:-deployed} (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: steps.preview.outputs.url
        env:
          URL: ${{ steps.preview.outputs.url }}
          VERSION_URL: ${{ steps.preview.outputs.version_url }}
        run: |
          {
            echo "### Preview"
            echo "- Alias: $URL"
            echo "- This version: $VERSION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: steps.preview.outputs.url && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ steps.preview.outputs.url }}
          VERSION_URL: ${{ steps.preview.outputs.version_url }}
          VERSION_ID: ${{ steps.preview.outputs.version_id }}
        with:
          script: |
            const marker = '<!-- project-site:preview -->';
            const { URL, VERSION_URL, VERSION_ID } = process.env;
            const body = [
              marker,
              `**Preview:** ${URL}`,
              '',
              `Updated for ${context.sha.slice(0, 7)}. This exact version: ${VERSION_URL || '(no per-version URL)'} (\`${VERSION_ID}\`).`,
              'The preview URL stays the same for the life of this PR.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
