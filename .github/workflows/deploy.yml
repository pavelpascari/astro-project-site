# Uploads the dist/ artifact built by ci.yml to Cloudflare Workers. Called by ci.yml; not triggered on its own.
#   target: preview    → `wrangler versions upload --preview-alias <alias>`; production is untouched.
#                        URL: https://<alias>-<worker-name>.<subdomain>.workers.dev
#   target: production → `wrangler deploy`.
# Without CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (fork, Dependabot, not configured yet) it logs a notice and
# succeeds. Docs: src/content/docs/docs/template/deploy.mdx
name: Deploy

on:
  workflow_call:
    inputs:
      site-dir:
        description: Folder holding package.json and wrangler.jsonc, relative to the workspace
        type: string
        required: true
      target:
        description: preview or production
        type: string
        required: true
      alias:
        description: Preview alias (pr-12, next, a branch name); ignored for production
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One upload per alias at a time; a newer push to the same PR replaces a queued one. Production never cancels.
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.target == 'production' && 'production' || inputs.alias }}
      cancel-in-progress: ${{ inputs.target != 'production' }}
    environment:
      name: ${{ inputs.target == 'production' && 'production' || 'preview' }}
      url: ${{ steps.preview.outputs.url || steps.production.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.site-dir }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not available to this run (fork PR, Dependabot, or not configured yet)."
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.site-dir }}/package-lock.json

      # Only for wrangler, at the version package-lock.json pins.
      - if: steps.creds.outputs.ok
        run: npm ci

      - uses: actions/download-artifact@v8
        if: steps.creds.outputs.ok
        with:
          name: dist
          path: ${{ inputs.site-dir }}/dist

      - name: Upload preview version
        id: preview
        if: steps.creds.outputs.ok && inputs.target == 'preview'
        env:
          ALIAS: ${{ inputs.alias }}
          MESSAGE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} @ ${{ github.sha }}"
        run: node scripts/deploy-preview.mjs --alias "$ALIAS" --message "$MESSAGE"

      - name: Deploy to production
        id: production
        if: steps.creds.outputs.ok && inputs.target == 'production'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          npx wrangler deploy --message "${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
          # First route wrangler reports (workers.dev or custom domain), for the environment link.
          url=$(node -e '
            const lines = require("fs").readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").split("\n").filter(Boolean);
            const target = lines.map(JSON.parse).findLast((e) => e.type === "deploy")?.targets?.[0] ?? "";
            const host = target.split(" ")[0];
            console.log(host && !host.includes("://") ? `https://${host}` : host);
          ' || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production: ${url:-deployed} (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: steps.preview.outputs.url
        env:
          URL: ${{ steps.preview.outputs.url }}
          VERSION_URL: ${{ steps.preview.outputs.version_url }}
        run: |
          {
            echo "### Preview"
            echo "- Alias: $URL"
            echo "- This version: $VERSION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: steps.preview.outputs.url && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.preview.outputs.url }}
          VERSION_URL: ${{ steps.preview.outputs.version_url }}
          VERSION_ID: ${{ steps.preview.outputs.version_id }}
        with:
          script: |
            const marker = '<!-- project-site:preview -->';
            const { URL, VERSION_URL, VERSION_ID } = process.env;
            const body = [
              marker,
              `**Preview:** ${URL}`,
              '',
              `Updated for ${context.sha.slice(0, 7)}. This exact version: ${VERSION_URL || '(no per-version URL)'} (\`${VERSION_ID}\`).`,
              'The preview URL stays the same for the life of this PR.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
