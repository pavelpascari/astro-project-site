# Release: push a signed tag `v<version>` matching packages/astro-project-site/package.json.
#
#   build (read-only token, no OIDC):
#     1. checks the tag against the package version, runs the tests and the full build
#     2. packs the package, writes its SHA-256 and extracts the version's CHANGELOG section
#   publish (needs build; runs no project or dependency code: no checkout, no npm install):
#     3. creates the GitHub release (pre-release for versions with a `-`), with the tarball, the checksum and the
#        version's CHANGELOG section as notes
#     4. stages the same tarball on npm through trusted publishing (OIDC: no token), `--tag beta` for pre-releases and
#        `latest` otherwise. Staged is not published: a maintainer approves it with 2FA (`npm stage list`, then
#        `npm stage approve <stage-id>`, or the package's page on npmjs.com), so this workflow alone cannot put a
#        version on npm. npm adds provenance on its own once the repository is public.
#        One-time setup on npmjs.com: astro-project-site → Settings → Trusted publishing → GitHub Actions,
#        user `pavelpascari`, repository `astro-project-site`, workflow `release.yml` (keep this file name), and
#        "Allow npm publish" and "Allow npm dist-tag" left unticked (staging is always allowed).
# No dependency cache anywhere in this workflow (cache poisoning would reach the published tarball).
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build # = the job id, so check names stay "build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Tag matches the package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/astro-project-site/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Version mismatch::tag $TAG but packages/astro-project-site/package.json says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "dist_tag=beta" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT";;
                             *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build everything
        run: npm run build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack -w astro-project-site --pack-destination "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          file="astro-project-site-$VERSION.tgz"
          test -f "$file"
          sha256sum "$file" > "$file.sha256"

      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' packages/astro-project-site/CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"
          if [ ! -s "$RUNNER_TEMP/release/notes.md" ]; then
            echo "::error title=No changelog section::packages/astro-project-site/CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish # = the job id, so check names stay "publish"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional, recommended: a `release` environment with required reviewers and a v* deployment-tag rule. If you
    # enable it, also enter `release` as the environment on npm's trusted publisher, or publishing is refused.
    # environment: release
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # npm trusted publishing (OIDC, staging only) and provenance
    steps:
      # `npm stage publish` needs npm 11.15.0+ (Node 24 ships it).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Verify the tarball
        id: file
        working-directory: ${{ runner.temp }}/release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          file="astro-project-site-$VERSION.tgz"
          sha256sum --check "$file.sha256"
          echo "file=$PWD/$file" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.file.outputs.file }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" "$FILE.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "astro-project-site $TAG" --notes-file "$RUNNER_TEMP/release/notes.md" --verify-tag "${flags[@]}"
          fi

      - name: Stage on npm (trusted publishing)
        env:
          FILE: ${{ steps.file.outputs.file }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          npm --version
          if npm view "astro-project-site@$VERSION" version --prefer-online > /dev/null 2>&1; then
            echo "::notice title=Already on npm::astro-project-site@$VERSION is already published"
            exit 0
          fi
          # No token: npm exchanges this job's OIDC identity (id-token: write) for a one-off credential that can
          # stage, not publish. The version goes live when a maintainer approves it with 2FA.
          # A version published moments before can be missing from `npm view` still; npm then refuses to stage it,
          # which means it is already there, not that the release failed.
          if ! out=$(npm stage publish "$FILE" --tag "$DIST_TAG" --access public 2>&1); then
            echo "$out"
            if grep -q 'Cannot stage previously published version' <<< "$out"; then
              echo "::notice title=Already on npm::astro-project-site@$VERSION is already published"
              exit 0
            fi
            exit 1
          fi
          echo "$out"
          {
            echo "### astro-project-site@$VERSION is staged on npm (tag \`$DIST_TAG\`)"
            echo
            echo "Not published yet. Approve it with 2FA: \`npm stage list\`, then \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Staged on npm::astro-project-site@$VERSION is staged; approve it with npm stage approve (2FA) to publish it"
