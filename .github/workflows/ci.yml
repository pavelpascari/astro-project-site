# This repository's CI: package tests and type checks, then the template's own site (site/) and the starter
# (starters/default/) built against the package. The site is deployed through the same reusable workflow
# (deploy.yml) that projects created with `project-site init` call.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      production:
        description: Deploy site/ to production
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test # = the job id, so check names stay "test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The npm cache is fine here: this job holds no secrets and publishes nothing (release.yml builds the npm
      # package without a cache), and npm ci checks every package against package-lock.json's integrity hashes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm # zizmor: ignore[cache-poisoning]
      - run: npm ci
      - name: Unit tests
        run: npm test
      # Package type check, then astro check + build + docs:check for site/ and starters/default/.
      - name: Build everything
        run: npm run build
      # html-validate's a11y rules and our own page checks on everything just built (site/ and the starter).
      - name: Accessibility of the built sites
        run: npm run test:a11y
      # The i18n fixture built in French and in Arabic (right to left): labels, <html lang/dir>, a11y again.
      - name: Languages
        run: npm run test:i18n
      - name: init → install → build, from the packed package
        run: |
          npm pack -w astro-project-site --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/astro-project-site-*.tgz)
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/packages/astro-project-site/bin/project-site.mjs" init fresh-site --yes --package "file:$tarball"
          cd fresh-site
          npm install --no-audit --no-fund
          npm run build

  site:
    needs: test
    permissions:
      contents: read       # check out the repository
      pull-requests: write # the sticky preview comment (deploy.yml's deploy job; same-repo PRs only)
    # A local reusable workflow is resolved from this same commit when the run starts, never from the runner's
    # filesystem, so the `$/` self-repository form adds nothing here (and actionlint does not parse it yet).
    uses: ./.github/workflows/deploy.yml # zizmor: ignore[self-repository]
    with:
      working-directory: site
      install-directory: .
      production: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
