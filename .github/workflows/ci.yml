# This repository's CI: package tests and type checks, then the template's own site (site/) and the starter
# (starters/default/) built against the package. The site is deployed through the same reusable workflow
# (deploy.yml) that projects created with `project-site init` call.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      production:
        description: Deploy site/ to production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      # Package type check, then astro check + build + docs:check for site/ and starters/default/.
      - name: Build everything
        run: npm run build
      - name: init → install → build, from the packed package
        run: |
          npm pack -w astro-project-site --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/astro-project-site-*.tgz)
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/packages/astro-project-site/bin/project-site.mjs" init fresh-site --package "file:$tarball"
          cd fresh-site
          npm install --no-audit --no-fund
          npm run build

  site:
    needs: test
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      working-directory: site
      install-directory: .
      production: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
    secrets: inherit
