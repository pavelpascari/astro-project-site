name: Bug report
description: Something in astro-project-site (the integration, the CLI, the starter or the deploy workflow) does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems do not belong here:** report them privately, see [SECURITY.md](https://github.com/pavelpascari/astro-project-site/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Integration / components / theme
        - Docs mounts / markdown / llms.txt
        - Mirrors / static apps
        - Blog / gallery / landing page
        - CLI (init, docs:gen, docs:check, deploy:preview)
        - Reusable deploy workflow (deploy.yml)
        - Starter
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the full error output.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest steps, config or repository that shows the problem. A link to a public repository is the most useful.
      placeholder: |
        1. npx astro-project-site@beta init my-site
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: astro-project-site version
      description: Output of `npm ls astro-project-site`, and the `deploy.yml@…` ref if it is about the workflow.
      placeholder: 0.1.0-beta.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of Astro and Starlight (`npm ls astro @astrojs/starlight`), Node.js (`node -v`), npm, and your OS. For browser issues, the browser and version.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
